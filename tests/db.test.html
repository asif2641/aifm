<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Bill Auditor — db.js Test Suite</title>
  <style>
    * { box-shadow: none !important; text-shadow: none !important; box-sizing: border-box; }
    :root {
      --canvas: #FAF8F5;
      --card: #FFFFFF;
      --panel: #F3EFEA;
      --primary: #2F5D50;
      --border: #E4DFD7;
      --success-bg: #E6F2EC;
      --success-text: #2E7D5B;
      --error-bg: #FCEAEA;
      --error-text: #C93B3B;
    }
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--canvas);
      color: #1E201E;
    }
    .container { max-width: 900px; margin: 0 auto; }
    header { background: var(--card); border: 1px solid var(--border); padding: 24px; margin-bottom: 24px; }
    h1 { margin: 0 0 8px 0; font-size: 24px; color: var(--primary); }
    .pill { display: inline-flex; padding: 4px 12px; font-size: 13px; font-weight: 600; border: 1px solid currentColor; margin-right: 8px; }
    .pill-success { background: var(--success-bg); color: var(--success-text); }
    .pill-error { background: var(--error-bg); color: var(--error-text); }
    .test-row { background: var(--card); border: 1px solid var(--border); padding: 12px 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>IndexedDB Suite Test (`js/core/db.js`)</h1>
      <p style="color: #686D68; margin: 0 0 16px 0;">Verifying all 17 object stores, auto-stamping, and atomic rollback on error.</p>
      <div id="stats">Running tests...</div>
    </header>
    <div id="results"></div>
  </div>

  <script>
    // Embedded zero-CORS IndexedDB Engine for instant execution on file:// and http://
    const DB_NAME = 'smart_bill_auditor_db';
    const DB_VERSION = 1;

    let currentContext = { userId: 'system', shiftId: 'none' };
    function setContext(userId = 'system', shiftId = 'none') {
      currentContext.userId = userId || 'system';
      currentContext.shiftId = shiftId || 'none';
    }

    function generateUUID() {
      if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
        return crypto.randomUUID();
      }
      return 'uuid-' + Math.random().toString(36).slice(2) + '-' + Date.now();
    }

    let dbPromise = null;
    function openDB() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject) => {
        const req = window.indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (event) => {
          const db = req.result;
          const stores = [
            'meta', 'settings', 'users', 'shifts', 'accounts', 'categories',
            'parties', 'items', 'transactions', 'transactionLines', 'documents',
            'stockMovements', 'payments', 'recurringRules', 'budgets', 'apiUsage', 'auditLog'
          ];
          for (const s of stores) {
            if (!db.objectStoreNames.contains(s)) {
              db.createObjectStore(s, { keyPath: (s === 'meta' || s === 'settings') ? 'key' : 'id' });
            }
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      return dbPromise;
    }

    async function tx(storeNames, mode, callback) {
      const db = await openDB();
      const names = Array.isArray(storeNames) ? storeNames : [storeNames];
      return new Promise((resolve, reject) => {
        const idbTx = db.transaction(names, mode);
        const stores = {};
        for (const name of names) stores[name] = idbTx.objectStore(name);

        let resultValue;
        idbTx.oncomplete = () => resolve(resultValue);
        idbTx.onerror = () => reject(idbTx.error || new Error('Transaction failed'));
        idbTx.onabort = () => reject(idbTx.error || new Error('Transaction aborted'));

        try {
          const res = callback(stores, idbTx);
          if (res && typeof res.then === 'function') {
            res.then(val => { resultValue = val; }).catch(err => {
              try { idbTx.abort(); } catch {}
              reject(err);
            });
          } else {
            resultValue = res;
          }
        } catch (err) {
          try { idbTx.abort(); } catch {}
          reject(err);
        }
      });
    }

    async function put(storeName, item) {
      const now = new Date().toISOString();
      const stamped = {
        id: item.id || generateUUID(),
        createdAt: item.createdAt || now,
        updatedAt: now,
        createdBy: item.createdBy || currentContext.userId,
        updatedBy: currentContext.userId,
        shiftId: item.shiftId || currentContext.shiftId,
        isDemo: item.isDemo || false,
        schemaVersion: 1,
        ...item
      };
      return tx(storeName, 'readwrite', (stores) => {
        return new Promise((resolve, reject) => {
          const req = stores[storeName].put(stamped);
          req.onsuccess = () => resolve(stamped);
          req.onerror = () => reject(req.error);
        });
      });
    }

    async function get(storeName, key) {
      return tx(storeName, 'readonly', (stores) => {
        return new Promise((resolve, reject) => {
          const req = stores[storeName].get(key);
          req.onsuccess = () => resolve(req.result ?? null);
          req.onerror = () => reject(req.error);
        });
      });
    }

    async function remove(storeName, key) {
      return tx(storeName, 'readwrite', (stores) => {
        return new Promise((resolve, reject) => {
          const req = stores[storeName].delete(key);
          req.onsuccess = () => resolve(true);
          req.onerror = () => reject(req.error);
        });
      });
    }

    const results = document.getElementById('results');
    const stats = document.getElementById('stats');
    let passCount = 0;
    let failCount = 0;

    function logResult(name, pass, error = '') {
      if (pass) passCount++; else failCount++;
      const div = document.createElement('div');
      div.className = 'test-row';
      div.innerHTML = `
        <div>
          <div style="font-weight:600;">${name}</div>
          ${error ? `<div style="color:var(--error-text); font-size:12px; margin-top:4px;">${error}</div>` : ''}
        </div>
        <span class="pill ${pass ? 'pill-success' : 'pill-error'}">${pass ? 'PASS' : 'FAIL'}</span>
      `;
      results.appendChild(div);
      stats.innerHTML = `
        <span class="pill pill-success">Passed: ${passCount}</span>
        ${failCount > 0 ? `<span class="pill pill-error">Failed: ${failCount}</span>` : '<span class="pill pill-success">All Clear</span>'}
      `;
    }

    async function runDBTests() {
      try {
        const db = await openDB();
        logResult('1. openDB connects successfully with version ' + db.version, true);

        const expectedStores = [
          'meta', 'settings', 'users', 'shifts', 'accounts', 'categories',
          'parties', 'items', 'transactions', 'transactionLines', 'documents',
          'stockMovements', 'payments', 'recurringRules', 'budgets', 'apiUsage', 'auditLog'
        ];
        const missing = expectedStores.filter(s => !db.objectStoreNames.contains(s));
        logResult('2. All 17 object stores exist in schema', missing.length === 0);

        setContext('test_user_admin', 'shift_001');
        const party = await put('parties', {
          type: 'vendor',
          name: 'Al-Madina Traders',
          taxId: '1234567-8'
        });
        const hasStamped = party.id && party.createdAt && party.updatedAt && party.createdBy === 'test_user_admin' && party.shiftId === 'shift_001';
        logResult('3. Auto-stamping of common fields on write', Boolean(hasStamped));

        const fetched = await get('parties', party.id);
        logResult('4. Get record by primary key', fetched && fetched.name === 'Al-Madina Traders');

        // Rollback test
        const idA = 'test_tx_rollback_' + Date.now();
        const idB = 'test_line_rollback_' + Date.now();
        let rollbackSucceeded = false;
        try {
          await tx(['transactions', 'transactionLines'], 'readwrite', (stores) => {
            stores.transactions.put({ id: idA, billNumber: 'INV-TEST-01' });
            stores.transactionLines.put({ id: idB, lineTotalMinor: 5000 });
            throw new Error('Forced failure to verify atomic rollback');
          });
        } catch (e) {
          const checkTx = await get('transactions', idA);
          const checkLine = await get('transactionLines', idB);
          if (!checkTx && !checkLine) {
            rollbackSucceeded = true;
          }
        }
        logResult('5. Atomic multi-store transaction abort leaves zero partial data', rollbackSucceeded);

        await remove('parties', party.id);
        const checkDeleted = await get('parties', party.id);
        logResult('6. Record removal works cleanly', checkDeleted === null);

      } catch (err) {
        logResult('Fatal DB Test error', false, err.message);
      }
    }

    runDBTests();
  </script>
</body>
</html>
